<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOMER DROP — Симулятор автономеров</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка с балансом и навигацией -->
    <header>
        <div class="header-top">
            <div class="brand-title">NOMER DROP</div>
            <div class="balance-box">Баланс: <span id="balanceText">100</span>$</div>
        </div>
        <nav class="navigation">
            <button class="nav-btn active" data-tab="tab-drop">Кейс (10$)</button>
            <button class="nav-btn" data-tab="tab-inventory">Инвентарь (<span id="invCount">0</span>)</button>
            <button class="nav-btn" data-tab="tab-history">История</button>
        </nav>
    </header>

    <main class="content">
        <!-- ВКЛАДКА 1: КРУТИЛКА (DROP) -->
        <section id="tab-drop" class="tab-content active">
            <div class="controls-container">
                <div class="counter" id="counterText">Всего попыток: 0</div>
                <div class="region-input-box">
                    <label for="customRegion">Регион:</label>
                    <input type="text" id="customRegion" maxlength="3" placeholder="77">
                </div>
            </div>

            <div class="plate-container">
                <div class="car-plate" id="plate">
                    <div class="plate-main" id="plateMain">А000АА</div>
                    <div class="plate-region-box">
                        <div class="region-number" id="plateRegion">77</div>
                        <div class="rus-section">
                            <span class="rus-text">RUS</span>
                            <div class="flag"><div class="flag-red"></div></div>
                        </div>
                    </div>
                </div>
                <!-- Информационная плашка о редкости выпавшего номера -->
                <div class="rarity-badge hidden" id="rarityBadge">Обычный</div>
            </div>

            <div class="action-zone">
                <button class="spin-btn" id="spinButton">Выбить за 10$</button>
                <button class="action-btn accept-btn hidden" id="acceptButton">Забрать в инвентарь</button>
            </div>
        </section>

        <!-- ВКЛАДКА 2: ИНВЕНТАРЬ -->
        <section id="tab-inventory" class="tab-content">
            <h2>Ваш гараж (Инвентарь)</h2>
            <div class="plates-grid" id="inventoryGrid">
                <p class="empty-msg">В инвентаре пока пусто. Выбейте номер и заберите его!</p>
            </div>
        </section>

        <!-- ВКЛАДКА 3: ИСТОРИЯ -->
        <section id="tab-history" class="tab-content">
            <h2>История дропов (Последние 20)</h2>
            <div class="history-list" id="historyList">
                <p class="empty-msg">История пуста. Нажмите «Выбить номер».</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
