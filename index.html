<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOMER DROP — Симулятор автономеров</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Фиксированный виджет баланса и рейтинга в правом нижнем углу -->
    <div class="fixed-balance">
        <div class="wallet-line">👛 Баланс: <span id="balanceText">100</span>$</div>
        <div class="rating-line">⭐ Рейтинг: <span id="ratingText">10</span>/10</div>
        <div class="spam-line" id="spamLine">Продано обычных: <span id="spamCountText">0</span>/10</div>
    </div>

    <!-- Шапка сайта -->
    <header>
        <div class="header-top">
            <div class="brand-title">NOMER DROP</div>
        </div>
        <nav class="navigation">
            <button class="nav-btn active" data-tab="tab-drop" id="navDropBtn">Кейс (10$)</button>
            <button class="nav-btn" data-tab="tab-inventory">Инвентарь (<span id="invCount">0</span>)</button>
            <button class="nav-btn" data-tab="tab-history">История</button>
        </nav>
    </header>

    <main class="content">
        <!-- ВКЛАДКА 1: КРУТИЛКА (DROP) -->
        <section id="tab-drop" class="tab-content active">
            
            <!-- Расширенная панель настройки подбора (по отдельности) -->
            <div class="controls-container">
                <div class="filter-group">
                    <label>Буква 1:</label>
                    <input type="text" id="filterL1" maxlength="1" placeholder="А" class="letter-input">
                </div>
                <div class="filter-group">
                    <label>Цифры:</label>
                    <input type="text" id="filterDigits" maxlength="3" placeholder="777" class="digits-input">
                </div>
                <div class="filter-group">
                    <label>Буквы 2-3:</label>
                    <input type="text" id="filterL23" maxlength="2" placeholder="АА" class="letter-input wide">
                </div>
                <div class="filter-group">
                    <label>Регион:</label>
                    <input type="text" id="customRegion" maxlength="3" placeholder="77" class="digits-input">
                </div>
            </div>

            <div class="plate-container">
                <div class="car-plate" id="plate">
                    <div class="plate-main" id="plateMain">А000АА</div>
                    <div class="plate-region-box">
                        <div class="region-number" id="plateRegion">77</div>
                        <div class="rus-section">
                            <span class="rus-text">RUS</span>
                            <div class="flag"><div class="flag-red"></div></div>
                        </div>
                    </div>
                </div>
                <div class="rarity-badge hidden" id="rarityBadge">Обычный</div>
            </div>

            <div class="action-zone">
                <button class="spin-btn" id="spinButton">Выбить за 10$</button>
                <button class="action-btn accept-btn hidden" id="acceptButton">Забрать в инвентарь</button>
            </div>
            <div class="counter-total" id="counterText">Выбито номеров: 0</div>
        </section>

        <!-- ВКЛАДКА 2: ИНВЕНТАРЬ -->
        <section id="tab-inventory" class="tab-content">
            <h2>Ваш гараж (Инвентарь)</h2>
            <div class="plates-grid" id="inventoryGrid">
                <p class="empty-msg">В инвентаре пока пусто. Выбейте номер и заберите его!</p>
            </div>
        </section>

        <!-- ВКЛАДКА 3: ИСТОРИЯ -->
        <section id="tab-history" class="tab-content">
            <h2>История дропов (Последние 20)</h2>
            <div class="history-list" id="historyList">
                <p class="empty-msg">История пуста. Нажмите «Выбить номер».</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
